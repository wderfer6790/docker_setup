services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SOURCE_ROOT}:/var/git
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    depends_on:
      - php
    networks:
      - net
    environment:
      TZ: Asia/Seoul


  php:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      TZ: Asia/Seoul
    build: ./php
    volumes:
      - ${SOURCE_ROOT}:/var/git
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    depends_on:
      - mysql
      - redis
    networks:
      - net

  node:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build: ./node
    working_dir: /var/git/www.wderfer6790.kr
    volumes:
      - ${SOURCE_ROOT}:/var/git
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    ports: 
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - net
    environment:
      TZ: Asia/Seoul

  websocket:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build: ./websocket
    working_dir: /var/git/websocket
    volumes:
      - ${SOURCE_ROOT}:/var/git
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    ports:
      - "3000:3000"
    command: npm run start
    networks:
      - net
    environment:
      TZ: Asia/Seoul

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER} 
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    networks:
      - net

  redis:
    image: redis:7-alpine
    networks:
      - net
    volumes:
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    environment:
      TZ: Asia/Seoul

volumes:
  mysql-data:

networks:
  net: